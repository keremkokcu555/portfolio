<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Aurora Renk Geçişi (Turkuaz - Mavi - Mor) -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6b11ff" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6b11ff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cam Efektli Obsidyen Arkaplan -->
  <rect width="512" height="512" rx="150" fill="#06070a"/>
  <!-- İnce Şık Kenarlık -->
  <rect x="12" y="12" width="488" height="488" rx="138" fill="none" stroke="url(#border-glow)" stroke-width="6"/>
  <!-- Geometrik ve Keskin K Harfi Vektörü -->
  <g filter="url(#neon-glow)">
    <path d="M 150 120 L 210 120 L 210 230 L 330 120 L 410 120 L 275 245 L 420 392 L 340 392 L 210 260 L 210 392 L 150 392 Z" fill="url(#aurora)"/>
  </g>
  <!-- Sağ Üstte Aktiflik / Canlılık Noktası -->
  <circle cx="390" cy="120" r="18" fill="#00f2fe" filter="url(#neon-glow)"/>
</svg>
